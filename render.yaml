databases:
  - name: cscvs-db
    databaseName: scheduler_db
    user: scheduler_user
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: cscvs-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    # NEW-FU-38: dropped `npm run seed` from the auto-deploy chain. Seed
    # creates admin1 with the hardcoded password "password123" — fine for
    # dev, catastrophic for prod. Migrations still run automatically. To
    # bootstrap a fresh prod DB with seed data once, run via Render shell:
    #   ALLOW_SEED=1 npm run seed
    # then rotate the admin password immediately.
    preDeployCommand: npm run migrate
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: cscvs-frontend
          property: hostport
      - key: DB_HOST
        fromDatabase:
          name: cscvs-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cscvs-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: cscvs-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: cscvs-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cscvs-db
          property: password

  - type: web
    name: cscvs-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cscvs-backend
          property: hostport
      - key: VITE_DEPT_ID
        value: SWE-DEPT
      - key: VITE_SEMESTER
        # NEW-FU-562 (audit-2 P2-14): migration 011 renames the legacy "Fall-2025" seed
        # label in-place to canonical code "251"; the code default, seed, and
        # .env.production.example all use "251". A stale "Fall-2025" here made a fresh prod
        # load boot a phantom empty term instead of the seeded 251. Quoted so YAML keeps it a string.
        value: "251"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
